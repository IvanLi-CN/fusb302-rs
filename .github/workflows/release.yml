name: Release

on:
  workflow_run:
    workflows: [Rust CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Merged commit SHA to publish.
        required: true
        type: string
      version:
        description: major, minor, patch, or an exact Cargo version.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  resolve:
    name: Resolve release intent
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      intent_kind: ${{ steps.intent.outputs.intent_kind }}
      source_sha: ${{ steps.intent.outputs.source_sha }}
      head_sha: ${{ steps.intent.outputs.head_sha }}
      base_sha: ${{ steps.intent.outputs.base_sha }}
      pull_request: ${{ steps.intent.outputs.pull_request }}
      version: ${{ steps.intent.outputs.version }}
      type: ${{ steps.intent.outputs.type }}
      channel: ${{ steps.intent.outputs.channel }}
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve immutable intent
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              python3 scripts/resolve_release_intent.py \
                --repo "$REPOSITORY" \
                --merge-sha "$WORKFLOW_RUN_SHA" \
                --output release-intent.json \
                --allow-bootstrap
              ;;
            workflow_dispatch)
              python3 scripts/resolve_release_intent.py \
                --repo "$REPOSITORY" \
                --merge-sha "$INPUT_SOURCE_SHA" \
                --output release-intent.json
              python3 scripts/validate_manual_publish.py \
                --intent release-intent.json \
                --version "$INPUT_VERSION"
              ;;
            *)
              echo "unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          source_sha="$(jq -r '.merge_commit_sha // .source_sha // .head_sha' release-intent.json)"
          test "$source_sha" != "null"
          python3 scripts/source_guard.py --repo "$REPOSITORY" --source-sha "$source_sha"
          {
            printf 'intent_kind=%s\n' "$(jq -r '.intent_kind // "release"' release-intent.json)"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'head_sha=%s\n' "$(jq -r '.head_sha // empty' release-intent.json)"
            printf 'base_sha=%s\n' "$(jq -r '.base_sha // empty' release-intent.json)"
            printf 'pull_request=%s\n' "$(jq -r '.pull_request' release-intent.json)"
            printf 'version=%s\n' "$(jq -r '.version' release-intent.json)"
            printf 'type=%s\n' "$(jq -r '.type' release-intent.json)"
            printf 'channel=%s\n' "$(jq -r '.channel' release-intent.json)"
            printf 'publish=%s\n' "$(jq -r '.publish' release-intent.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable intent
        uses: actions/upload-artifact@v4
        with:
          name: release-intent
          path: release-intent.json
          if-no-files-found: error
          retention-days: 90

      - name: Stage trusted registry tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-tooling"
          cp scripts/registry_state.py "${RUNNER_TEMP}/release-tooling/registry_state.py"

      - name: Upload trusted registry tooling
        uses: actions/upload-artifact@v4
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tooling/registry_state.py
          if-no-files-found: error
          retention-days: 90

  preflight:
    name: Package release source
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      registry_exists: ${{ steps.registry.outputs.exists }}
      registry_yanked: ${{ steps.registry.outputs.yanked }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Download immutable intent
        uses: actions/download-artifact@v4
        with:
          name: release-intent
          path: ${{ runner.temp }}/release-inputs

      - name: Download trusted registry tooling
        uses: actions/download-artifact@v4
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tooling

      - name: Verify manifest and package
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$EXPECTED_VERSION"
          cargo package --locked

      - name: Inspect registry state
        id: registry
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          input_dir="${RUNNER_TEMP}/release-inputs"
          python3 "${RUNNER_TEMP}/release-tooling/registry_state.py" --version "$VERSION" | tee "${input_dir}/registry-state.json"
          exists="$(jq -r '.exists' "${input_dir}/registry-state.json")"
          yanked="$(jq -r '.yanked // false' "${input_dir}/registry-state.json")"
          if [[ "$yanked" == "true" ]]; then
            echo "published version is yanked and cannot form a release unit" >&2
            exit 1
          fi
          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"
          printf 'yanked=%s\n' "$yanked" >> "$GITHUB_OUTPUT"

      - name: Dry-run new registry publication
        if: ${{ steps.registry.outputs.exists != 'true' && needs.resolve.outputs.publish == 'true' }}
        run: cargo publish --locked --dry-run

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-inputs
          path: |
            ${{ runner.temp }}/release-inputs/release-intent.json
            ${{ runner.temp }}/release-inputs/registry-state.json
          if-no-files-found: error
          retention-days: 90

  prepare:
    name: Prepare release surfaces
    needs: [resolve, preflight]
    if: >-
      ${{
        needs.preflight.result == 'success' &&
        needs.resolve.outputs.publish == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      publish_needed: ${{ steps.mode.outputs.publish_needed }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release inputs
        uses: actions/download-artifact@v4
        with:
          name: release-unit-inputs

      - name: Render release notes
        run: python3 scripts/release_notes.py --intent release-intent.json --output release-notes.md

      - name: Decide publish operation
        id: mode
        env:
          RELEASE_KIND: ${{ needs.resolve.outputs.intent_kind }}
          RELEASE_PUBLISH: ${{ needs.resolve.outputs.publish }}
          REGISTRY_EXISTS: ${{ needs.preflight.outputs.registry_exists }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_KIND" == "release" && "$RELEASE_PUBLISH" == "true" && "$REGISTRY_EXISTS" != "true" ]]; then
            printf 'publish_needed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'publish_needed=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse draft release surface
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          args=(
            prepare
            --repo "$REPOSITORY"
            --tag "release/$VERSION"
            --source-sha "$SOURCE_SHA"
            --title "fusb302 $VERSION"
            --notes-file release-notes.md
          )
          if [[ "$CHANNEL" == "beta" || "$CHANNEL" == "dev" ]]; then
            args+=(--prerelease)
          fi
          python3 scripts/release_surfaces.py "${args[@]}"

      - name: Upload prepared release
        uses: actions/upload-artifact@v4
        with:
          name: release-prepared
          path: |
            release-intent.json
            release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish crate with OIDC
    needs: [resolve, preflight, prepare]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.publish_needed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Package exact source
        run: cargo package --locked

      - name: Exchange OIDC token for crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish exact package
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --token "$CRATES_IO_TOKEN"

      - name: Wait for registry visibility
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 scripts/wait_for_registry.py --version "$VERSION"

  finalize:
    name: Finalize release unit
    needs: [resolve, preflight, prepare, publish]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        needs.preflight.result == 'success' &&
        (needs.resolve.outputs.publish != 'true' || needs.prepare.result == 'success') &&
        (needs.resolve.outputs.publish != 'true' ||
         needs.prepare.outputs.publish_needed != 'true' ||
         needs.publish.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release inputs
        uses: actions/download-artifact@v4
        with:
          name: release-unit-inputs

      - name: Skip non-release intent
        if: ${{ needs.resolve.outputs.publish != 'true' }}
        run: |
          jq '{status: "skipped", version, source_sha: (.merge_commit_sha // .head_sha), type, channel, publish}' release-intent.json > release-skip.json

      - name: Finalize public surfaces
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          args=(finalize --repo "$REPOSITORY" --tag "release/$VERSION")
          if [[ "$CHANNEL" == "beta" || "$CHANNEL" == "dev" ]]; then
            args+=(--prerelease)
          fi
          python3 scripts/release_surfaces.py "${args[@]}"
          python3 scripts/check_release_contract.py \
            --repo "$REPOSITORY" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA"

      - name: Write release receipt
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PULL_REQUEST: ${{ needs.resolve.outputs.pull_request }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          RELEASE_TYPE: ${{ needs.resolve.outputs.type }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/release_receipt.py \
            --output release-receipt.json \
            --repository "$REPOSITORY" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --type "$RELEASE_TYPE" \
            --channel "$CHANNEL" \
            --status published \
            --run-url "$RUN_URL"

      - name: Upload release receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: release-*.json
          if-no-files-found: error
          retention-days: 365
