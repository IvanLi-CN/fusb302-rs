name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version declared in Cargo.toml"
        required: true
        type: string
      confirm:
        description: "Type publish-fusb302 to confirm crates.io publication"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify confirmation and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          test "$CONFIRMATION" = "publish-fusb302"
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$EXPECTED_VERSION"
      - run: cargo package
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
